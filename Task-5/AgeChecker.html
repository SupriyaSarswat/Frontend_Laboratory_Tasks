<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Vote Eligibility Checker</h1>
    <script>
            let age = prompt("Please enter your age:");
            document.write("Your age is: " + age+"<br>"); // Example age, replace with actual input
            age = Number(age); // Convert the input to a number
            if(age>0 && Number.isFinite(age) && Number.isInteger(age)) {
                if (age >= 18) {
                    alert("congrats! you can vote.");
                    document.write("You are eligible to vote.");
                }
            else {
                    alert("Sorry, you cannot vote.");
                    document.write("You are not eligible to vote.");
                }}
            else {
                alert("bleehhhhh!!!!!! you are an idiot....don't you know how to enter a valid age?");
                document.write("Please enter a valid age.");
            }
        </script>
</body>
</html>
